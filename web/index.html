<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7cc4ef">
<title>Mountain Mayhem: GOATed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%90%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div id="stage"><b>Stage <span id="stageNo">1</span></b><span id="stageSub">herd</span></div>
    <div id="herd"></div>
    <div id="scouted" hidden></div>
    <div class="topbtns"><button id="btnSet" aria-label="Settings">⚙</button><button id="btnLog" aria-label="Game log">📜</button><button id="btnHelp" aria-label="How to play">?</button></div>
  </header>
  <section id="players"></section>
  <main id="boardWrap"><div id="board"></div><div id="toast" aria-live="polite"></div></main>
  <section id="bets"></section>
  <footer id="actions"></footer>
</div>
<div id="overlay" hidden></div>
<div id="sheet" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
