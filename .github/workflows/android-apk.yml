name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the APK to a release on v* tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Read the app version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="$(node -p "require('./package.json').version")-${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version: $V"
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      # Copies web/ into the Android project (gitignored, regenerated every build).
      - name: Sync web assets into the Android project
        run: npm run cap:sync
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK after the version
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "mountain-mayhem-${{ steps.ver.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mountain-mayhem-${{ steps.ver.outputs.version }}-debug-apk
          path: mountain-mayhem-${{ steps.ver.outputs.version }}.apk
      - name: Attach the APK to the release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "mountain-mayhem-${{ steps.ver.outputs.version }}.apk" --generate-notes
